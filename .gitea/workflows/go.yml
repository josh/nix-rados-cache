name: Go

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.ceph }}, linux/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        ceph:
          - umbrella
          - tentacle
          - squid
        arch:
          - amd64
        include:
          - ceph: tentacle
            arch: arm64
    runs-on: ceph-${{ matrix.ceph }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          dnf install --assumeyes xz

      - name: Print Ceph version
        run: ceph --version

      - name: Download Nix
        run: |
          case "$(uname -m)" in
            x86_64) sha256=c4d1aed088f62aa729823cffa3269e880de6ce6102fecb8909f2821eedb2f2eb ;;
            aarch64) sha256=ee696971de946d311699f6dd639cccc8c6734aec9a061b8e205de0ce6515e5ae ;;
          esac
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 5 --retry-all-errors --output nix.tar.xz "https://releases.nixos.org/nix/nix-$NIX_VERSION/nix-$NIX_VERSION-$(uname -m)-linux.tar.xz"
          echo "$sha256  nix.tar.xz" | sha256sum --check
          mkdir nix
          tar --extract --xz --file nix.tar.xz --directory nix --strip-components 1
        env:
          # renovate: datasource=github-tags depName=NixOS/nix
          NIX_VERSION: "2.36.0"

      - name: Configure Nix
        run: |
          mkdir -p /etc/nix
          cat >/etc/nix/nix.conf <<'EOF'
          build-users-group =
          experimental-features = nix-command ca-derivations
          substituters =
          EOF

      - name: Install Nix
        run: |
          "$RUNNER_TEMP/nix/install" --no-daemon --no-channel-add --no-modify-profile
          echo "$HOME/.nix-profile/bin" >>"$GITHUB_PATH"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build

      - name: Test
        timeout-minutes: 25
        run: |
          go test -cover -timeout 20m
