name: Go

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.ceph }}, linux/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        ceph:
          - tentacle
          - squid
        arch:
          - amd64
          - arm64
    runs-on: ceph-${{ matrix.ceph }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          dnf install --assumeyes xz

      - name: Print Ceph version
        run: ceph --version

      - name: Download Nix
        run: |
          case "$(uname -m)" in
            x86_64) sha256=b12ab64a291e41846b9da37b7f56eafa7683deaa267bafb2ed43440ab2f45f13 ;;
            aarch64) sha256=1f177b572baadf8c09750028f047fe943a3615a34f3e4a43927367a1e0120801 ;;
          esac
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 5 --retry-all-errors --output nix.tar.xz "https://releases.nixos.org/nix/nix-$NIX_VERSION/nix-$NIX_VERSION-$(uname -m)-linux.tar.xz"
          echo "$sha256  nix.tar.xz" | sha256sum --check
          mkdir nix
          tar --extract --xz --file nix.tar.xz --directory nix --strip-components 1
        env:
          # renovate: datasource=github-tags depName=NixOS/nix
          NIX_VERSION: "2.35.6"

      - name: Configure Nix
        run: |
          mkdir -p /etc/nix
          cat >/etc/nix/nix.conf <<'EOF'
          build-users-group =
          experimental-features = nix-command
          substituters =
          EOF

      - name: Install Nix
        run: |
          "$RUNNER_TEMP/nix/install" --no-daemon --no-channel-add --no-modify-profile
          echo "$HOME/.nix-profile/bin" >>"$GITHUB_PATH"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build

      - name: Test
        timeout-minutes: 25
        run: |
          go test -timeout 20m
